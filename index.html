<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Focus World</title>
  <style>
    :root {color-scheme:light; --ink:#213c30; --muted:#61766a; --line:#d8e3d9; --leaf:#2d6646}
    * {box-sizing:border-box}
    body {margin:0; padding:clamp(24px,7vw,80px) 20px 48px; color:var(--ink); background:#f2f5ed; font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
    main {width:min(100%,620px); margin:auto}
    .brand {margin-bottom:32px; display:flex; align-items:center; gap:12px; font-size:13px; letter-spacing:.12em; font-weight:700}
    .seed {width:38px; height:38px; display:grid; place-items:center; border-radius:50%; background:#dce8d3; color:var(--leaf)}
    h1 {font-size:clamp(30px,6vw,42px); line-height:1.2; letter-spacing:-.035em; margin:0 0 20px; font-weight:650}
    .card {display:block; padding:20px 24px; margin-bottom:14px; background:#fffefa; border:1px solid var(--line); border-radius:18px; color:var(--ink); text-decoration:none}
    .card:hover {border-color:#9fbf8f}
    .card small {display:block; color:var(--muted)}
    footer {padding:22px 4px 0; font-size:13px; color:var(--muted)}
  </style>
</head>
<body>
<main>
  <div class="brand"><span class="seed" aria-hidden="true">❧</span>FOCUS WORLD</div>
  <h1>Focus World</h1>
  <a class="card" href="./privacy-policy.html"><strong>Chính sách quyền riêng tư</strong><small>Privacy policy</small></a>
  <a class="card" href="./delete-account.html"><strong>Xoá tài khoản</strong><small>Delete your account</small></a>
  <footer>Liên hệ · Contact: <a href="mailto:focusworld3d@gmail.com">focusworld3d@gmail.com</a></footer>
</main>
</body>
</html>
